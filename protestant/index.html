<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Protestant Model | Formation Systems</title>
<meta name="description" content="A model of Protestant discipleship as a self-producing body. In development.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--ink:#24232a;--mute:#5d5965;--taupe:#a89a8c;--taupe-dk:#978879}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fff;color:var(--ink);font:18px/1.65 "Source Sans 3",system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:40px 20px}
main{max-width:640px;text-align:center}
.k{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
h1{font:600 clamp(38px,6vw,60px)/1.05 "EB Garamond",Georgia,serif;margin:8px 0 14px}
p{margin:0 0 28px;color:var(--mute)}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:10px 22px;border-radius:999px;background:var(--taupe);color:#fff;text-decoration:none;font-weight:600}
.btn:hover{background:var(--taupe-dk)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main>
  <span class="k">Formation Systems</span>
  <h1>The Protestant model</h1>
  <p>Word and sacrament, congregational life and the shape of Protestant church structures, modeled as a self-producing body. This model is in development.</p>
  <a class="btn" href="../">Back to Formation Systems</a>
</main>
</body>
</html>
